distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.9.0-bin.zip
# Published at services.gradle.org/distributions/gradle-9.9.0-bin.zip.sha256. validateDistributionUrl
# below only checks the URL's shape; this checks the bytes that arrive, on a runner that holds the
# release keystore.
#
# It is verified at download time only: an already-unpacked distribution is never re-checked, as a
# wrong sum against a warm wrapper cache demonstrates by building happily. So it bites exactly when
# the version changes -- which is the moment that matters. Bump it with every Gradle upgrade; a
# stale sum stops the fresh download, while deleting the line skips the check in silence.
#
# `gradlew wrapper` rewrites this file from scratch and drops every comment in it, this one
# included. Upgrading means running it, then putting this block back.
distributionSha256Sum=0b00b0ffe07c4d4789c12d4935a44a7057d55774b7540bd4a3f76f336deb177a
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
