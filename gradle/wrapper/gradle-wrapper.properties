distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.1-bin.zip
# Published at services.gradle.org/distributions/gradle-9.8.1-bin.zip.sha256. validateDistributionUrl
# above only checks the URL's shape; this checks the bytes that arrive, on a runner that holds the
# release keystore.
#
# It is verified at download time only: an already-unpacked distribution is never re-checked, as a
# wrong sum against a warm wrapper cache demonstrates by building happily. So it bites exactly when
# the version changes -- which is the moment that matters. Bump it with every Gradle upgrade; a
# stale sum stops the fresh download, while deleting the line skips the check in silence.
#
# `gradlew wrapper` rewrites this file from scratch and drops every comment in it, this one
# included. Upgrading means running it, then putting this block back.
distributionSha256Sum=dce76f55f8e251a3a1f130eb120f30b3d271de2b76c9b0729d316b5a1b6dc01f
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
