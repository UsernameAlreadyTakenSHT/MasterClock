distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.0-bin.zip
# Published at services.gradle.org/distributions/gradle-9.7.0-bin.zip.sha256. validateDistributionUrl
# above only checks the URL's shape; this checks what actually arrived, on a runner that holds the
# release keystore. Bump it with every Gradle upgrade: a stale sum stops the build with a checksum
# error, but deleting the line makes the wrapper skip the check without saying anything.
distributionSha256Sum=84fbba45c7f4c64abc77460e1c00f541e9f960e3c7ed2538f1ede19eacd873ae
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
