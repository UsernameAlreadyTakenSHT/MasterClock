distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
# Published at services.gradle.org/distributions/gradle-9.7.1-bin.zip.sha256. validateDistributionUrl
# above only checks the URL's shape; this checks the bytes that arrive, on a runner that holds the
# release keystore.
#
# It is verified at download time only: an already-unpacked distribution is never re-checked, as a
# wrong sum against a warm wrapper cache demonstrates by building happily. So it bites exactly when
# the version changes -- which is the moment that matters. Bump it with every Gradle upgrade; a
# stale sum stops the fresh download, while deleting the line skips the check in silence.
distributionSha256Sum=acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
