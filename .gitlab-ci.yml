# Pinned by digest, not by tag, and for the same reason .github/workflows/build-apks.yml pins every
# action by commit SHA: a tag is mutable, and the job that runs on this image decodes the release
# keystore and holds its three passwords. Whoever controls the tag -- by repushing it, or by
# compromising the upstream account -- would otherwise run arbitrary code beside the signing key.
# The rule was applied strictly on one forge and not at all on the other.
#
# This is eclipse-temurin:21-jdk-jammy as of 2026-09-09. Moving to a newer JDK image means resolving
# the new tag to its digest and replacing both the digest and this comment:
#   TOKEN=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/eclipse-temurin:pull" | jq -r .token)
#   curl -sI -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.oci.image.index.v1+json" \
#     https://registry-1.docker.io/v2/library/eclipse-temurin/manifests/21-jdk-jammy | grep -i docker-content-digest
image: eclipse-temurin:21-jdk-jammy@sha256:d48e921b83506f58910295b35fd02978c7f4c57fef41bceee6a460d7d97bc251

variables:
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/android-sdk"
  ANDROID_HOME: "$CI_PROJECT_DIR/android-sdk"
  ANDROID_CMDLINE_TOOLS_VERSION: "11076708"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/masterclock/${CI_COMMIT_TAG}"

stages:
  - build
  - release

build_apks:
  stage: build
  # This job decodes the release keystore and writes its three passwords into local.properties, and
  # GitLab reads this file from the ref being built. A web-triggered pipeline used to be allowed on
  # any ref, so pushing a branch with an edited script and pressing "Run pipeline" was enough to walk
  # off with the app signing key -- the one credential in this project that cannot be rotated without
  # every user reinstalling by hand.
  #
  # Requiring a protected ref closes that: an unprotected branch no longer reaches the signing step.
  # The belt-and-braces version is to mark ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
  # ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD as Protected in Settings > CI/CD > Variables, which
  # GitLab then refuses to expose to any unprotected ref regardless of what this file says. That is a
  # project setting and cannot be committed here.
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_REF_PROTECTED == "true"'
  before_script:
    - apt-get update -qq && apt-get install -y -qq wget unzip curl gawk
    - mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
    - wget -q "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS_VERSION}_latest.zip" -O cmdline-tools.zip
    # This archive is unzipped and put on the PATH four lines before the release keystore is
    # decoded, so whatever comes back from dl.google.com runs beside the signing key. It arrived
    # with no integrity check at all, while Gradle's own distribution three files away is pinned
    # with distributionSha256Sum -- the same care, not applied here.
    #
    # Google publishes only a SHA-1 for this file, in
    # https://dl.google.com/android/repository/repository2-3.xml:
    #   <checksum type="sha1">d313adb7aedccf6cf0cfca51ec180f0059f5f8f8</checksum>
    #   <size>153607504</size>
    # The digest below is SHA-256 of the bytes that match that published SHA-1 and that size, so it
    # is pinned to what Google's own manifest describes rather than to whatever a download happened
    # to produce. Bumping ANDROID_CMDLINE_TOOLS_VERSION means replacing this line too.
    - echo "2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  cmdline-tools.zip" | sha256sum -c -
    - unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
    - mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
    - export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
    - yes | sdkmanager --licenses > /dev/null || true
    - echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$CI_PROJECT_DIR/release.keystore"
    - |
      cat >> local.properties <<EOF
      MASTERCLOCK_RELEASE_STORE_FILE=$CI_PROJECT_DIR/release.keystore
      MASTERCLOCK_RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
      MASTERCLOCK_RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS
      MASTERCLOCK_RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
      EOF
    - chmod +x gradlew
  script:
    - export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
    # The bar from AGENTS.md, same as the GitHub side. Both pipelines used to run assemble tasks
    # only, so a tag whose tests failed was signed and published to two forges with nothing
    # objecting.
    - ./gradlew :core:test :app:lintCompleteRelease :paper:lintRelease
    - ./gradlew buildAllReleaseFlavors
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        # Digests are recorded against the *published* name, not the path they are built at, so the
        # file reads the same as the GitHub one and matches what a user actually downloads.
        # Verify with: sha256sum -c SHA256SUMS.txt
        rm -f SHA256SUMS.txt
        for flavor in complete standard lite mini; do
          apk_path=$(find "app/build/outputs/apk/${flavor}/release" -name "*.apk" | head -n1)
          target_name="masterclock-${flavor}-${CI_COMMIT_TAG}.apk"
          echo "$(sha256sum "${apk_path}" | cut -d' ' -f1)  ${target_name}" >> SHA256SUMS.txt
          echo "Uploading ${apk_path} as ${target_name}..."
          curl --silent --show-error --fail \
            --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
            --upload-file "${apk_path}" \
            "${PACKAGE_REGISTRY_URL}/${target_name}"
        done
        paper_apk_path=$(find "paper/build/outputs/apk/release" -name "*.apk" | head -n1)
        paper_target_name="masterclock-paper-${CI_COMMIT_TAG}.apk"
        echo "$(sha256sum "${paper_apk_path}" | cut -d' ' -f1)  ${paper_target_name}" >> SHA256SUMS.txt
        echo "Uploading ${paper_apk_path} as ${paper_target_name}..."
        curl --silent --show-error --fail \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "${paper_apk_path}" \
          "${PACKAGE_REGISTRY_URL}/${paper_target_name}"

        cat SHA256SUMS.txt
        echo "Uploading SHA256SUMS.txt..."
        curl --silent --show-error --fail \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file SHA256SUMS.txt \
          "${PACKAGE_REGISTRY_URL}/SHA256SUMS-${CI_COMMIT_TAG}.txt"

        awk '/^## /{n++} n==1{print}' CHANGELOG.md > release_notes.md
      fi
  after_script:
    # after_script runs whether the build passed or failed, which is what makes it the right place
    # for this. local.properties carries the three signing passwords, so it has to be removed
    # alongside the keystore it unlocks rather than left behind for the rest of the job -- the same
    # asymmetry the GitHub workflow had.
    - rm -f "$CI_PROJECT_DIR/release.keystore" "$CI_PROJECT_DIR/local.properties"
  artifacts:
    name: "masterclock-apks-$CI_COMMIT_REF_NAME"
    paths:
      - app/build/outputs/apk/*/release/*.apk
      - paper/build/outputs/apk/release/*.apk
      - release_notes.md
    expire_in: 90 days
  cache:
    key:
      files:
        - gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle/wrapper
      - .gradle/caches

release_tag:
  stage: release
  # Same rule as the build image above. `:latest` in the job that holds CI_JOB_TOKEN was the loosest
  # pin in either pipeline. Digest resolved 2026-09-09:
  #   TOKEN=$(curl -s "https://gitlab.com/jwt/auth?service=container_registry&scope=repository:gitlab-org/release-cli:pull" | jq -r .token)
  #   curl -sI -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.oci.image.manifest.v1+json" \
  #     https://registry.gitlab.com/v2/gitlab-org/release-cli/manifests/latest | grep -i docker-content-digest
  image: registry.gitlab.com/gitlab-org/release-cli:latest@sha256:3f52d526f48e8d10625c722fa6d6423ee82aadeae1b1aa91f07b62551d96dacf
  rules:
    - if: '$CI_COMMIT_TAG'
  needs:
    - job: build_apks
      artifacts: true
  script:
    - |
      release-cli create \
        --tag-name "$CI_COMMIT_TAG" \
        --description "$(cat release_notes.md)" \
        --assets-link "{\"name\":\"MasterClock complete (APK)\",\"url\":\"${PACKAGE_REGISTRY_URL}/masterclock-complete-${CI_COMMIT_TAG}.apk\"}" \
        --assets-link "{\"name\":\"MasterClock standard (APK)\",\"url\":\"${PACKAGE_REGISTRY_URL}/masterclock-standard-${CI_COMMIT_TAG}.apk\"}" \
        --assets-link "{\"name\":\"MasterClock lite (APK)\",\"url\":\"${PACKAGE_REGISTRY_URL}/masterclock-lite-${CI_COMMIT_TAG}.apk\"}" \
        --assets-link "{\"name\":\"MasterClock mini (APK)\",\"url\":\"${PACKAGE_REGISTRY_URL}/masterclock-mini-${CI_COMMIT_TAG}.apk\"}" \
        --assets-link "{\"name\":\"MasterClock paper (APK)\",\"url\":\"${PACKAGE_REGISTRY_URL}/masterclock-paper-${CI_COMMIT_TAG}.apk\"}" \
        --assets-link "{\"name\":\"SHA256SUMS.txt\",\"url\":\"${PACKAGE_REGISTRY_URL}/SHA256SUMS-${CI_COMMIT_TAG}.txt\"}"
