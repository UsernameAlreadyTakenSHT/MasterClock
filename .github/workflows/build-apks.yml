name: Build APKs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Every action below is pinned to a commit SHA rather than a tag, with the release it belongs to in
# the trailing comment. A tag like "v7" is mutable: whoever controls the action's repository can
# repoint it at any moment, and this job holds the release keystore and its passwords. A SHA cannot
# be repointed. Updating an action therefore means resolving its new tag to a SHA and changing both
# the SHA and the comment -- `gh api repos/<owner>/<repo>/commits/<tag> --jq .sha` prints it.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # gradle-wrapper.jar is the code that enforces distributionSha256Sum, so it is the one file
      # whose tampering would silently switch off the only integrity check this build has on Gradle
      # itself. It is committed to the repository and has not changed since the initial commit while
      # gradle-wrapper.properties moved to 9.7.1 in three steps -- and nothing verified it.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Both of these steps are gated on a tag, and that gate is the whole point of them.
      #
      # This workflow also answers workflow_dispatch, which GitHub allows on any branch. Without the
      # gate, pushing a branch with an edited script and pressing "Run workflow" walked off with the
      # app signing key -- the one credential in this project that cannot be rotated without every
      # user reinstalling by hand. The same hole was closed on GitLab in 9f258f4 by requiring a
      # protected ref; this side was left open, and RELEASING.md recommends dispatch as the way to
      # rehearse CI changes, which is exactly the path an attacker would take.
      #
      # A dispatch run still builds. hasReleaseSigningConfig in app/build.gradle.kts is false
      # without these properties, so it produces unsigned APKs -- which is what a smoke build should
      # produce anyway.
      #
      # Marking the four secrets as protected/environment-scoped in the repository settings is the
      # belt-and-braces version, and cannot be committed here.
      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/release.keystore"

      - name: Write local.properties (release signing)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cat >> local.properties <<KEYEOF
          MASTERCLOCK_RELEASE_STORE_FILE=${{ github.workspace }}/release.keystore
          MASTERCLOCK_RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MASTERCLOCK_RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          MASTERCLOCK_RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYEOF

      # The bar from AGENTS.md, run where it cannot be forgotten. Until now CI ran assemble tasks
      # only: a tag whose tests failed was signed, published to two forges and given its SHA-256
      # digests without a single step objecting, and the only thing standing in the way was the
      # maintainer remembering to run these on their own machine first.
      - name: Test and lint
        run: ./gradlew :core:test :app:lintCompleteRelease :paper:lintRelease

      - name: Build all flavors + paper (release APKs)
        run: ./gradlew buildAllReleaseFlavors

      # The keystore and the passwords that open it both have to go, and both before any later step
      # runs: local.properties carries all three passwords, and the release action further down is
      # third-party code with the whole workspace in reach. Deleting only the keystore -- which is
      # what this step used to do -- guarded the lock and left the keys beside it.
      - name: Remove signing material
        if: always()
        run: rm -f "${{ github.workspace }}/release.keystore" local.properties

      # The ref name reaches the shell through the environment, not through expression
      # interpolation. `${{ }}` is substituted into the script before bash ever sees it, and `$`,
      # `(`, `)` and backticks are all legal in a git ref -- so a tag named v0.9.0$(...) ran
      # arbitrary code here, before SHA256SUMS.txt is computed below and published to the release.
      # A token holding contents:write but not the workflow scope can push such a tag while being
      # unable to edit this file, which is a real boundary to cross. The GitLab side already does
      # this correctly with $CI_COMMIT_TAG.
      - name: Stage renamed artifacts
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          tag="$REF_NAME"
          for flavor in complete standard lite mini; do
            cp "app/build/outputs/apk/${flavor}/release/"*.apk "dist/masterclock-${flavor}-${tag}.apk"
          done
          cp paper/build/outputs/apk/release/*.apk "dist/masterclock-paper-${tag}.apk"

      # Computed here, after the APKs are signed and under their published names, so the digests
      # are of the exact bytes a user downloads. Hashing an intermediate would produce a number
      # that verifies nothing. Verify a download with: sha256sum -c SHA256SUMS.txt
      - name: Checksum the published APKs
        run: |
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APKs as build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: masterclock-apks-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Extract changelog section for this tag
        if: startsWith(github.ref, 'refs/tags/')
        run: awk '/^## /{n++} n==1{print}' CHANGELOG.md > release_notes.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          body_path: release_notes.md
