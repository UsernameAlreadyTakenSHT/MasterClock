Name: MasterClock Mini
Summary: The bare essentials, a minimal three-mode chess clock
Description: |-
  MasterClock Mini is the bare-essentials build of MasterClock, a chess clock for chess,
  wargames, and tabletop games.

  This build sticks to three timing modes: Sudden Death, Bonus (Fischer increment), and
  Move Timer (Standard). No extra settings screens, no presets library, no arbitre mode,
  just a clock you can set up in a few taps. If you want more timing modes or extra
  tools, look for MasterClock Lite, MasterClock Standard, or MasterClock instead.

  MasterClock collects no data, contains no ads, no trackers, and needs no network
  connection to work.

  For transparency: this app is developed with the help of AI (Claude Code). Review the
  code accordingly before relying on it.

