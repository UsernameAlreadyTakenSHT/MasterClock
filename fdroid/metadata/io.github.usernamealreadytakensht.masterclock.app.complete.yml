Name: MasterClock
Summary: A chess clock for chess, wargames, and tabletop games
Description: |-
  MasterClock is a chess clock for chess, wargames, and tabletop games. It handles
  classic time controls as well as more complex multi-phase formats.

  This is the Complete build, which includes every feature. Three other builds exist
  (Standard, Lite, Mini) with progressively fewer options, for players who just want a
  simpler clock.

  Classic time controls:

  * Sudden Death, Fischer, Bronstein, US Delay
  * Byoyomi (Japanese, Canadian, Progressive)
  * Hourglass, Gong, Hidden/Random time
  * Move counters, fast-move variants, time banking

  Also included:

  * Notebook (text, drawing, audio, photo, video, and board notes)
  * Scoreboard and game history with PGN/PDN/KIF export
  * Mini-games: coin toss, dice roll, short straw, blindfold trainer, and more

  MasterClock collects no data, contains no ads, no trackers, and needs no network
  connection to work.

  For transparency: this app is developed with the help of AI (Claude Code). Review the
  code accordingly before relying on it.

